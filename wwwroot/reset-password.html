<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raven ERP — Réinitialisation du mot de passe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page-body">

  <div class="auth-container">
    <div class="auth-card suite-auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <img src="logo.svg" alt="Raven Logo" class="auth-logo">
          <span class="auth-brand-name">Raven</span>
        </div>
        <h1 class="auth-title">Nouveau mot de passe</h1>
        <p class="auth-subtitle">Définissez un nouveau mot de passe sécurisé pour votre compte.</p>
      </div>

      <div id="reset-alert" class="auth-alert" style="display: none;"></div>

      <form id="form-reset-password" class="auth-form">
        <div class="auth-field">
          <label for="reset-new-pwd" class="auth-label">Nouveau mot de passe</label>
          <div class="auth-input-wrapper">
            <input type="password" id="reset-new-pwd" class="auth-input" placeholder="Minimum 8 caractères" minlength="8" required autocomplete="new-password">
            <button type="button" id="btn-toggle-new-pwd" class="auth-pwd-icon-btn" title="Afficher/Masquer le mot de passe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="auth-svg-icon">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-field">
          <label for="reset-confirm-pwd" class="auth-label">Confirmer le mot de passe</label>
          <div class="auth-input-wrapper">
            <input type="password" id="reset-confirm-pwd" class="auth-input" placeholder="Répéter le mot de passe" minlength="8" required autocomplete="new-password">
          </div>
        </div>

        <button type="submit" id="btn-submit-reset" class="btn btn-primary auth-submit-btn">
          <span>Modifier le mot de passe</span>
        </button>
      </form>

      <div id="reset-success-box" style="display: none; text-align: center; margin-top: 16px;">
        <a href="/" class="btn btn-primary" style="display: inline-block; width: 100%; text-decoration: none;">
          Se connecter
        </a>
      </div>

      <div class="auth-footer-nav" id="reset-back-nav">
        <a href="/" class="auth-back-link">Retour à la page de connexion</a>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    const form = document.getElementById("form-reset-password");
    const newPwdInput = document.getElementById("reset-new-pwd");
    const confirmPwdInput = document.getElementById("reset-confirm-pwd");
    const alertDiv = document.getElementById("reset-alert");
    const submitBtn = document.getElementById("btn-submit-reset");
    const successBox = document.getElementById("reset-success-box");
    const backNav = document.getElementById("reset-back-nav");
    const toggleBtn = document.getElementById("btn-toggle-new-pwd");

    if (!token) {
      alertDiv.className = "auth-alert auth-alert-danger";
      alertDiv.textContent = "Lien de réinitialisation invalide ou manquant. Veuillez renouveler votre demande.";
      alertDiv.style.display = "block";
      form.style.display = "none";
    }

    toggleBtn?.addEventListener("click", () => {
      newPwdInput.type = newPwdInput.type === "password" ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const newPassword = newPwdInput.value;
      const confirmPassword = confirmPwdInput.value;

      alertDiv.style.display = "none";

      if (newPassword !== confirmPassword) {
        alertDiv.className = "auth-alert auth-alert-danger";
        alertDiv.textContent = "Les deux mots de passe ne correspondent pas.";
        alertDiv.style.display = "block";
        return;
      }

      if (newPassword.length < 8) {
        alertDiv.className = "auth-alert auth-alert-danger";
        alertDiv.textContent = "Le mot de passe doit comporter au moins 8 caractères.";
        alertDiv.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Modification en cours...";

      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            token,
            newPassword,
            confirmPassword
          })
        });

        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          alertDiv.className = "auth-alert auth-alert-success";
          alertDiv.textContent = data.message || "Votre mot de passe a été modifié avec succès.";
          alertDiv.style.display = "block";
          form.style.display = "none";
          successBox.style.display = "block";
          if (backNav) backNav.style.display = "none";
        } else {
          alertDiv.className = "auth-alert auth-alert-danger";
          alertDiv.textContent = data.message || "Le lien de réinitialisation est invalide ou a expiré.";
          alertDiv.style.display = "block";
        }
      } catch (err) {
        alertDiv.className = "auth-alert auth-alert-danger";
        alertDiv.textContent = "Erreur de communication avec le serveur.";
        alertDiv.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Modifier le mot de passe";
      }
    });
  </script>
</body>
</html>
