<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="ravenGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ravenGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ravenGradWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <filter id="ravenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Hex Shield -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#ravenGradWing)" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Internal Grid Line Pattern -->
  <path d="M4 32 H96 M4 68 H96 M32 4 V96 M68 4 V96" stroke="#1e293b" stroke-width="1" opacity="0.4" />

  <!-- Raven Geometric Body & Wings -->
  <g filter="url(#ravenGlow)">
    <!-- Right Wing Feather 1 -->
    <path d="M 50 18 L 82 34 L 64 46 L 50 36 Z" fill="url(#ravenGradAccent)" opacity="0.9" />
    <!-- Right Wing Feather 2 -->
    <path d="M 50 36 L 86 48 L 62 58 L 50 48 Z" fill="url(#ravenGradPrimary)" />
    <!-- Right Wing Feather 3 -->
    <path d="M 50 48 L 78 66 L 54 70 L 50 58 Z" fill="#0284c7" />

    <!-- Left Wing Feather 1 -->
    <path d="M 50 18 L 18 34 L 36 46 L 50 36 Z" fill="url(#ravenGradAccent)" opacity="0.9" />
    <!-- Left Wing Feather 2 -->
    <path d="M 50 36 L 14 48 L 38 58 L 50 48 Z" fill="url(#ravenGradPrimary)" />
    <!-- Left Wing Feather 3 -->
    <path d="M 50 48 L 22 66 L 46 70 L 50 58 Z" fill="#0284c7" />

    <!-- Central Raven Head & Beak -->
    <path d="M 50 14 L 56 28 L 50 38 L 44 28 Z" fill="#ffffff" />
    <!-- Beak -->
    <polygon points="50,12 47,20 53,20" fill="#38bdf8" />

    <!-- Sleek Tail Feathers -->
    <polygon points="50,56 45,86 50,82 55,86" fill="url(#ravenGradAccent)" />
    
    <!-- Central Core Eye / Node -->
    <circle cx="50" cy="30" r="2.8" fill="#38bdf8" />
  </g>
</svg>
